<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>[ SECURE SYSTEM ]</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
        
        .step { display: none; width: 100%; max-width: 600px; text-align: center; padding: 40px; position: absolute; animation: fadeIn 1s ease; z-index: 1; }
        .active { display: flex; flex-direction: column; align-items: center; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h1 { font-size: 24px; text-shadow: 0 0 10px #ff0000; margin-bottom: 20px; line-height: 1.5; }
        
        button { margin-top: 30px; padding: 15px 40px; background: none; border: 1px solid #ff0000; color: #fff; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; letter-spacing: 2px; }
        button:hover { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        
        input { background: none; border: 1px solid #ff0000; color: #fff; padding: 15px; text-align: center; font-size: 20px; margin-top: 20px; width: 220px; outline: none; }

        /* تأثير الخطأ الكبير */
        #error-overlay { position:fixed; top:0; left:0; width:100%; height:100%; display:none; justify-content:center; align-items:center; z-index:999; background: #800000; }

        /* تأثير نزول الدم */
        #blood-screen {
            position: fixed; top: -100%; left: 0; width: 100%; height: 100%;
            background-color: #660000; z-index: 1000; transition: top 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        #blood-screen.dripping { top: 0; }

        /* تزيين قطرات الدم */
        .drop { position: absolute; bottom: -50px; width: 10%; height: 100px; background: #660000; border-radius: 0 0 50% 50%; }
    </style>
</head>
<body>

    <div id="error-overlay">
        <h1 style="font-size: 100px;">❌</h1>
    </div>

        <div class="drop" style="left: 30%; height: 140px;"></div>
        <div class="drop" style="left: 45%; height: 200px;"></div>
