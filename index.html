<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>.......</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:'Montserrat',sans-serif;
            background:#000;
            color:#fff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
        }

        .step{
            display:none;
            width:100%;
            max-width:650px;
            text-align:center;
            padding:40px;
            position:absolute;
        }

        .active{
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        h1{
            font-size:24px;
            text-shadow:0 0 10px #ff0000;
            margin-bottom:25px;
            min-height:1.5em;
            line-height:1.6;
        }

        .btn-container{
            display:none;
            gap:40px;
            align-items:center;
            justify-content:center;
            margin-top:40px;
            min-height:120px;
            width:100%;
        }

        button{
            position:relative;
            padding:16px 45px;
            background:rgba(0,0,0,0.4);
            border:1px solid #ff0000;
            color:#fff;
            cursor:pointer;
            font-weight:bold;
            text-transform:uppercase;
            letter-spacing:2px;
            overflow:hidden;
            transition:0.35s ease;
            border-radius:12px;
            backdrop-filter:blur(4px);
            box-shadow:0 0 15px rgba(255,0,0,0.2);
        }

        button::before{
            content:"";
            position:absolute;
            top:0;
            left:-100%;
            width:100%;
            height:100%;
            background:linear-gradient(
                120deg,
                transparent,
                rgba(255,255,255,0.2),
                transparent
            );
            transition:0.5s;
        }

        button:hover::before{
            left:100%;
        }

        button:hover{
            background:#ff0000;
            box-shadow:
                0 0 10px #ff0000,
                0 0 30px #ff0000,
                0 0 60px rgba(255,0,0,0.6);
        }

        button:active{
            transform:scale(0.95);
        }

        input{
            background:none;
            border:1px solid #ff0000;
            color:#fff;
            padding:15px;
            text-align:center;
            font-size:20px;
            margin-top:20px;
            width:200px;
            outline:none;
            border-radius:10px;
        }

        .error-flash{
            background-color:#550000 !important;
        }

    </style>
</head>

<body>

    <div id="error-overlay"
    style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    background:#800000;
    ">
        <h1 style="font-size:100px;">❌</h1>
    </div>

    <!-- STEP 1 -->

    <div class="step active" id="s1">

        <h1 id="text1"></h1>

        <div class="btn-container" id="btns1">

            <button id="btn-no" onclick="refuse()">
                Refuse
            </button>

            <button id="btn-yes" onclick="next(2)">
                Continue
            </button>

        </div>

    </div>

    <!-- STEP 2 -->

    <div class="step" id="s2">

        <h1 id="text2"></h1>

        <button id="b2" onclick="next(3)">
            Continue
        </button>

    </div>

    <!-- STEP 3 -->

    <div class="step" id="s3">

        <h1 id="text3"></h1>

        <button id="b3" onclick="next(4)">
            Next
        </button>

    </div>

    <!-- STEP 4 -->

    <div class="step" id="s4">

        <h1 id="text4"></h1>

        <button id="b4" onclick="next(5)">
            Proceed
        </button>

    </div>

    <!-- PASSWORD -->

    <div class="step" id="s5">

        <h1>
            Enter the Enigma Password
        </h1>

        <input type="password" id="pass" placeholder="****">

        <br><br>

        <button onclick="check()">
            Unlock
        </button>

    </div>

    <!-- FINAL -->

    <div class="step" id="s6">

        <h1 id="text6" style="font-size:18px;"></h1>

    </div>

<script>

const texts = {

1:
"If you are interested, continue until the end...",

2:
"Not surprising… I knew you would continue.",

3:
"You’re not just continuing now… you’re getting closer to understanding.",

4:
"Remember the solution to the riddle… you’ll need it.",

6:
"Here you are… turning twenty-one.\n\nIt’s strange how quickly time passes, but your place in my heart doesn’t pass or change.\n\nI’m truly grateful to have you in my life.\n\nHappy birthday, Mohamed.\n\nI wish you a year that feels worthy of your heart."

};


// TYPEWRITER

function typeWriter(elementId, text, i = 0, callback = null){

    const el = document.getElementById(elementId);

    if(i === 0){
        el.innerHTML = "";
    }

    if(i < text.length){

        el.innerHTML += text.charAt(i) === '\n'
        ? '<br>'
        : text.charAt(i);

        setTimeout(() => {

            typeWriter(elementId,text,i + 1,callback);

        },40);

    } else {

        if(elementId === 'text1'){
            document.getElementById('btns1').style.display = 'flex';
        }

        if(callback){
            callback();
        }
    }
}


// NEXT STEP

function next(n){

    document.querySelectorAll('.step')
    .forEach(s => s.classList.remove('active'));

    const current = document.getElementById('s' + n);

    current.classList.add('active');

    const button = current.querySelector('button');

    if(button && n !== 5){
        button.style.display = 'none';
    }

    if(texts[n]){

        typeWriter(
            'text' + n,
            texts[n],
            0,

            () => {

                if(button && n !== 5){
                    button.style.display = 'inline-block';
                }

            }

        );

    }

}


// REFUSE BUTTON

function refuse() {

    const noBtn = document.getElementById('btn-no');
    const yesBtn = document.getElementById('btn-yes');

    // يخفي زر الرفض
    noBtn.style.display = 'none';

    // يكبر زر Continue
    yesBtn.style.transform = 'scale(1.8)';

    // يخليه في الوسط
    document.getElementById('btns1').style.justifyContent = 'center';
}


// PASSWORD

function check(){

    if(document.getElementById('pass').value === "0521"){

        next(6);

    } else {

        showError();

    }

}


// ERROR EFFECT

function showError(){

    let overlay =
    document.getElementById('error-overlay');

    overlay.style.display = 'flex';

    document.body.classList.add('error-flash');

    setTimeout(() => {

        overlay.style.display = 'none';

        document.body.classList.remove('error-flash');

    },800);

}


// START

typeWriter('text1', texts[1]);

</script>

</body>
</html>
